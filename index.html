return `<div class="cover" style="background-image:url(${s.cover||''})"><img class="logo" src="${s.logo||''}"></div><h2>${esc(s.name)}</h2><span class="tag">${esc(s.seg)}</span> <span class="star">${stars(s)}</span> ${badge(s)} <button class="b2" onclick="fav('${s.id}')">${FAVS.includes(s.id)?'❤️':'🤍'}</button><p>${esc(s.desc)}</p><p>🕒 ${hrs(s)}</p><p>📍 ${esc(s.address)}</p><div class="row"><a class="b" target="_blank" onclick="hit('${s.id}','clicksMap')" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(s.address+' '+CITY)}">🧭 Como chegar</a><a class="b bw" target="_blank" onclick="hit('${s.id}','clicksWa')" href="https://wa.me/${wa(s.whats)}?text=${encodeURIComponent('Olá! Vi sua loja no Achei Guará.')}">💬 WhatsApp</a></div><h3>Produtos</h3><div class="grid">${ps.map(prodCard).join('')||'<p>Sem produtos ainda.</p>'}</div>${revSec(s)}`}
const hit=(id,k)=>db.collection('stores').doc(id).update({[k]:FV.increment(1)}).catch(()=>{});

function add(pid){const p=S.products.find(x=>x.id==pid),c=S.cart.find(x=>x.pid==pid);c?c.qty++:S.cart.push({pid,sid:p.storeId,name:p.name,price:p.price,qty:1});saveCart();render()}
const qty=(pid,d)=>{const c=S.cart.find(x=>x.pid==pid);c.qty+=d;if(c.qty<1)S.cart=S.cart.filter(x=>x!=c);saveCart();render()};
function cartV(){if(!S.cart.length)return'<p>Seu carrinho está vazio.</p>';const ids=[...new Set(S.cart.map(c=>c.sid))];return ids.map(id=>{const s=S.stores.find(x=>x.id==id)||{name:'Loja'},it=S.cart.filter(c=>c.sid==id);return `<div class="card"><b>${esc(s.name)}</b>${it.map(c=>`<div class="row" style="justify-content:space-between"><span>${esc(c.name)} — ${R(c.price*c.qty)}</span><span><button class="b2" onclick="qty('${c.pid}',-1)">−</button> ${c.qty} <button class="b2" onclick="qty('${c.pid}',1)">+</button></span></div>`).join('')}<select id="fr_${id}"><option value="-1">Retirar na loja (grátis)</option>${parseFr(s).map((f,i)=>`<option value="${i}">Entrega: ${esc(f.n)} — ${R(f.v)}</option>`).join('')}</select><input id="ad_${id}" placeholder="Endereço de entrega (se houver)"><input id="cp_${id}" placeholder="Cupom de desconto (opcional)"><button class="bw" onclick="checkout('${id}')">Finalizar no WhatsApp da loja</button></div>`}).join('')}
function checkout(sid){const it=S.cart.filter(c=>c.sid==sid),s=S.stores.find(x=>x.id==sid),code=v('cp_'+sid).toUpperCase();let tot=0,m=`Olá, ${s.name}! Pedido pelo Achei Guará:\n`;it.forEach(c=>{const p=S.products.find(x=>x.id==c.pid)||{},off=p.cc&&p.cc.toUpperCase()==code?p.cp:0,t=c.price*c.qty*(1-off/100);tot+=t;m+=`• ${c.qty}x ${c.name} — ${R(t)}${off?` (cupom ${off}%)`:''}\n`});const f=parseFr(s)[+($('fr_'+sid)?.value??-1)];if(f){tot+=f.v;m+=`Entrega (${f.n}): ${R(f.v)}\nEndereço: ${v('ad_'+sid)}\n`}else m+='Retirada na loja\n';m+=`Total: ${R(tot)}\nCliente: ${S.user.displayName||S.user.email}`;
window.open('https://wa.me/'+wa(s.whats)+'?text='+encodeURIComponent(m));db.collection('stores').doc(sid).update({sales:FV.increment(1),salesTotal:FV.increment(tot)}).catch(()=>{});S.cart=S.cart.filter(c=>c.sid!=sid);saveCart();render()}
/* IA */
function chatV(){return `<div>${S.chat.map(m=>`<div class="msg ${m.b?'bot':'me'}">${m.t}</div>`).join('')}</div><div class="row"><input id="ci" placeholder="Ex: melhor pizzaria? o que fazer na cidade?" onkeydown="if(event.key=='Enter')ask()"><button onclick="ask()">Enviar</button></div>`}
function ask(){const t=v('ci');if(!t)return;S.chat.push({t:esc(t)});const q=t.toLowerCase(),w=q.split(/\W+/).filter(x=>x.length>3);
let st=S.stores.filter(active).map(s=>({s,sc:w.reduce((a,x)=>a+([s.name,s.seg,s.desc].join(' ').toLowerCase().includes(x)?2:0)+(S.products.some(p=>p.storeId==s.id&&p.name.toLowerCase().includes(x))?1:0),0)}));
const best=/melhor|avali|indica|top/.test(q);st=st.filter(x=>x.sc>0||(best&&!w.filter(x=>!/melhor|avali|indica|lugar|lugares|comercio/.test(x)).length)).sort((a,b)=>best?avg(b.s)-avg(a.s)||b.sc-a.sc:b.sc-a.sc).slice(0,4);
let r=st.length?'Encontrei estes lugares:<br>'+st.map(x=>`• <a href="#" onclick="openStore('${x.s.id}');return false">${esc(x.s.name)}</a> (${esc(x.s.seg)}) ${x.s.rcount?avg(x.s).toFixed(1)+'★':'novo'}`).join('<br>'):'Não achei isso nas lojas cadastradas ainda.';
if(/dica|passe|turismo|visitar|fazer|conhecer|evento/.test(q))r+='<br><br>💡 '+TIPS.join('<br>💡 ');S.chat.push({b:1,t:r});render();scrollTo(0,9999)}

try{if(id)await db.collection('stores').doc(id).update(d);else{const r=await db.collection('stores').add({...d,owner:S.user.uid,hidden:false,expires:Date.now()+7*DAY,created:Date.now(),views:0,clicksWa:0,clicksMap:0,sales:0,salesTotal:0,rsum:0,rcount:0});S.sid=r.id;S.tab='loja'}alert('Salvo!');tmp={};render()}catch(e){alert(e.message)}}
function lojasT(){const l=[...S.stores].sort((a,b)=>a.expires-b.expires);return `<div class="card"><button onclick="S.sid=null;S.tab='novaloja';render()">➕ Cadastrar loja/prestador</button></div>`+l.map(s=>`<div class="card"><b>${esc(s.name)}</b> ${s.hidden?'🚫oculta':''}<br><small>${days(s)>0?days(s)+' dias restantes':'⚠️ VENCIDA'} · ${esc(s.whats)}</small><div class="row" style="flex-wrap:wrap"><button class="b2" onclick="S.sid='${s.id}';S.tab='loja';render()">Editar</button><button class="b2" onclick="S.sid='${s.id}';S.tab='prod';render()">Produtos</button><button onclick="more('${s.id}')">+30 dias (pago)</button><button class="b2" onclick="db.collection('stores').doc('${s.id}').update({hidden:${!s.hidden}})">${s.hidden?'Exibir':'Ocultar'}</button><a class="b bw" target="_blank" href="https://wa.me/${wa(s.whats)}?text=${encodeURIComponent('Olá! Sua mensalidade do Achei Guará vence em breve. PIX: '+PIX)}">Cobrar</a><button class="bd" onclick="del('stores','${s.id}')">Excluir</button></div></div>`).join('')}

function bannersT(){tmp={};return `<div class="card"><h3>Novo banner</h3><input id="bt" placeholder="Título/texto"><select id="bs"><option value="">Sem loja (propaganda do app)</option>${S.stores.map(s=>`<option value="${s.id}">${esc(s.name)}</option>`).join('')}</select>${pic('ban')}<br><button onclick="addB()">Publicar</button></div>`+S.banners.map(b=>`<div class="card">${esc(b.title)} ${b.status=='pendente'?`<b>⏳ pendente (${b.dias}d · ${R(b.preco)})</b> <button onclick="actB('${b.id}',${b.dias})">Ativar (pago)</button>`:b.exp?`<small>até ${new Date(b.exp).toLocaleDateString('pt-BR')}</small>`:''} <button class="bd" onclick="del('banners','${b.id}')">Excluir</button></div>`).join('')}
const addB=async()=>{await db.collection('banners').add({title:v('bt'),storeId:v('bs'),img:tmp.ban||''});tmp={};render()};

function prodT(){const s=cur();if(!s)return'<p>Escolha uma loja.</p>';tmp={};return `<div class="card"><h3>Novo produto</h3><input id="pn" placeholder="Nome"><input id="pp" type="number" step="0.01" placeholder="Preço"><textarea id="pd" placeholder="Descrição"></textarea><div class="row"><input id="cc" placeholder="Cupom (ex: GUARA10)"><input id="cp" type="number" placeholder="% desc."></div>${pic('pimg')}<br><button onclick="addP()">Adicionar</button></div><div class="grid">${S.products.filter(p=>p.storeId==s.id).map(p=>`<div class="card"><img src="${p.img||''}"><b>${esc(p.name)}</b><br>${R(p.price)}<br><button class="bd" onclick="del('products','${p.id}')">Excluir</button></div>`).join('')}</div>`}
async function addP(){if(!v('pn')||!v('pp'))return alert('Nome e preço');await db.collection('products').add({storeId:S.sid,name:v('pn'),price:+v('pp'),desc:v('pd'),cc:v('cc'),cp:+v('cp')||0,img:tmp.pimg||''});tmp={};render()}
function promoT(){return `<div class="card"><h3>📣 Enviar notificação aos clientes</h3><input id="nt" placeholder="Título (ex: Promoção de sábado!)"><textarea id="nx" placeholder="Mensagem"></textarea><button onclick="sendN()">Enviar</button></div>`}

function planoT(){const s=cur();return `<div class="card"><h3>💳 Plano</h3><p>${days(s)>0?`Restam <b>${days(s)} dias</b>`:'⚠️ <b>Plano vencido</b> — loja oculta'}</p><p>Renovação: <b>R$ 49,00/mês</b> (+30 dias)<br>Chave PIX: <b>${PIX}</b></p><button onclick="navigator.clipboard.writeText('${PIX}');alert('PIX copiado')">Copiar PIX</button> <a class="b bw" target="_blank" href="https://wa.me/${SUP}?text=${encodeURIComponent('Olá! Paguei a renovação da loja '+s.name)}">Enviar comprovante / Suporte</a></div>`}
const storeLink=id=>location.origin+location.pathname+'?loja='+id,DN=['Dom','Seg','Ter','Qua','Qui','Sex','Sáb'];
function isOpen(s){if(!s.hAb||!s.hFe||!(s.hd||[]).length)return null;const n=new Date(),t=n.getHours()*60+n.getMinutes(),m=x=>+x.slice(0,2)*60+ +x.slice(3,5),a=m(s.hAb),f=m(s.hFe),d=n.getDay();return f>a?s.hd.includes(d)&&t>=a&&t<f:(s.hd.includes(d)&&t>=a)||(s.hd.includes((d+6)%7)&&t<f)}
const badge=s=>{const o=isOpen(s);return o===null?'':o?'<span class="tag" style="background:#d4f5de;color:#0a7c4a">🟢 Aberto agora</span>':'<span class="tag" style="background:#fde0dd;color:#c0392b">🔴 Fechado</span>'};
const hrs=s=>s.hAb?`${s.hAb}–${s.hFe} (${(s.hd||[]).map(d=>DN[d]).join(', ')})`:'Horário não informado';
const fav=id=>{FAVS=FAVS.includes(id)?FAVS.filter(x=>x!=id):[...FAVS,id];localStorage.favs=JSON.stringify(FAVS);render()};
const parseFr=s=>(s.fretes||'').split('\n').map(l=>l.split('=')).filter(a=>a[1]&&a[0].trim()).map(a=>({n:a[0].trim(),v:parseFloat(a[1].replace(',','.'))||0}));
const revSec=s=>`<h3>⭐ Avaliações</h3>${S.reviews.filter(r=>r.storeId==s.id&&r.status=='aprovada').slice(0,5).map(r=>`<div class="card">${'★'.repeat(r.stars)} <small>${esc(r.user)}</small><br>${esc(r.text)}</div>`).join('')||'<p>Sem avaliações ainda.</p>'}<div class="card"><select id="rs"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><textarea id="rv" placeholder="Conte sua experiência"></textarea><button onclick="sendRev('${s.id}')">Enviar avaliação</button><br><small>Passa por moderação antes de aparecer.</small></div>`;
async function sendRev(id){if(!v('rv'))return alert('Escreva um comentário');await db.collection('reviews').add({storeId:id,stars:+v('rs'),text:v('rv'),user:S.user.displayName||S.user.email.split('@')[0],uid:S.user.uid,status:'pendente',ts:Date.now()});$('rv').value='';alert('Enviada! Aparece após aprovação.')}

function avalT(){const p=S.reviews.filter(r=>r.status=='pendente');return '<h3>Avaliações pendentes</h3>'+(p.map(r=>{const s=S.stores.find(x=>x.id==r.storeId)||{};return `<div class="card"><b>${esc(s.name)}</b> ${'★'.repeat(r.stars)}<br><small>${esc(r.user)}</small><p>${esc(r.text)}</p><button onclick="modRev('${r.id}',true)">Aprovar</button> <button class="bd" onclick="modRev('${r.id}',false)">Rejeitar</button></div>`}).join('')||'<p>Nada pendente 🎉</p>')}
function planAlert(){if(!S.user)return'';const m=S.stores.find(s=>s.owner==S.user.uid);let h='';if(m&&days(m)<=3)h+=`<div class="card" style="background:#fff3cd">⚠️ ${days(m)>0?`Sua mensalidade vence em <b>${days(m)} dia(s)</b>`:'<b>Sua mensalidade venceu</b> e a loja está oculta'}. Renove por PIX <b>${PIX}</b> (R$ 49,00).<br><button onclick="S.sid='${m.id}';S.tab='plano';go('panel')">Ver plano</button></div>`;if(isAdm()){const n=S.stores.filter(s=>days(s)<=3&&days(s)>0).length;if(n)h+=`<div class="card" style="background:#fff3cd">⏰ ${n} loja(s) vencem em até 3 dias. <button onclick="S.tab='lojas';go('panel')">Ver e cobrar</button></div>`}return h}
function anunT(){const s=cur();tmp={};return `<div class="card"><h3>📢 Anuncie no banner da tela inicial</h3><p>Sua loja aparece no carrossel para todos os clientes.</p><select id="bp">${BAN.map(([d,p],i)=>`<option value="${i}">${d} dias — ${R(p)}</option>`).join('')}</select><input id="bt" placeholder="Texto do banner (ex: Promoção de inauguração!)">${pic('ban')}<br><button onclick="reqB()">Solicitar banner</button><p><small>Pague o PIX <b>${PIX}</b> e envie o comprovante no WhatsApp. O banner entra no ar quando o pagamento for confirmado.</small></p></div>`+S.banners.filter(b=>b.storeId==s.id).map(b=>`<div class="card">${esc(b.title)} — <b>${b.status=='ativo'?'✅ no ar'+(b.exp?' até '+new Date(b.exp).toLocaleDateString('pt-BR'):''):'⏳ aguardando pagamento'}</b></div>`).join('')}

const actB=(id,d)=>db.collection('banners').doc(id).update({status:'ativo',exp:Date.now()+d*DAY});
function qrT(){const s=cur();return `<div class="card" style="text-align:center"><h3>${esc(s.name)}</h3><p>Escaneie e veja nossa vitrine no 📍 Achei Guará</p><div id="qr" style="display:inline-block"></div><p><small>${storeLink(s.id)}</small></p><button onclick="print()">🖨️ Imprimir</button></div>`}
const NB=[['Centro Histórico',-22.8164,-45.1925],['Vila Paraíba',-22.8085,-45.196],['Pedregulho',-22.828,-45.187],['Beira Rio',-22.813,-45.201],['Chácaras Selles',-22.821,-45.176],['Alto das Almas',-22.803,-45.189],['Campo do Galvão',-22.819,-45.204],['Engenheiro Neiva',-22.798,-45.168],['Parque São Francisco',-22.834,-45.195],['Figueira',-22.825,-45.21],['Vila Municipal',-22.815,-45.188],['Jardim Rony',-22.809,-45.205]];
function km(s){const n=NB.find(x=>x[0]==s.bairro);if(!S.pos||!n)return null;const t=x=>x*Math.PI/180,a=Math.sin(t(n[1]-S.pos.lat)/2)**2+Math.cos(t(S.pos.lat))*Math.cos(t(n[1]))*Math.sin(t(n[2]-S.pos.lng)/2)**2;return 12742*Math.asin(Math.sqrt(a))}
